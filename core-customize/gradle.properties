################################################################################
# Dependencies #################################################################
################################################################################
# Include Spartacus Sample Data extension
# If set to true the build.gradle script will insert the correct version (same
# as commerce version)
thirdPartyExtension.spartacus-sample-data = true

# Version of the CPQ data loader libs (only if the project uses SAP CPQ for
# Product Configuration)
# cpqVersion=3.0.2

# Sybit Hybris extensions as separate properties:
# sybitExtension.<extension-name>=<version>
# NOTE: you can use the name of a branch instead of a tag for <version>
# Loadable Extensions can be found here:
# https://gitlab.sybit.dev/sybit/commerce/extensions
# HINT: use the URL slug of the extension from the URL when you open it within
# the browser
#sybitExtension.localization/core = v5.1.0
#sybitExtension.localization/backoffice = v4.0.1
sybitExtension.frontend/securemediaweb = v1.0.0

# This extension is required for Git LFS projects!
sybitExtension.ccv2/lfsinstall = develop

# Third Party Commerce extensions as separat properties:
# thirdPartyExtension.<extension-name>=<version>
# NOTE: you can use the name of a branch instead of a tag for <version>
# Loadable Extensions can be found here:
# https://gitlab.sybit.dev/third-party/sap/commerce/extensions
# HINT: use the URL slug of the extension from the URL when you open it within
# the browser
thirdPartyExtension.sanecleanup = v3.5.4
# thirdPartyExtension.areco-deploymentscripts-manager/core = v4.1.1
# thirdPartyExtension.areco-deploymentscripts-manager/backoffice = v2.0.0

################################################################################
# Build ########################################################################
################################################################################
# Only unzip the currently used Hybris extensions during installation
hybrisUnzipFilterEnabled = true
# Config name for builds
buildConfig = _env-local
# Disable Gradle daemon
org.gradle.daemon = false
# Ant options
antOpts = -Xmx2048m
# Additional Ant tasks exposed as Gradle tasks "ant_<task>"
antTasks =
# Additional comma-separated excludes to be ignored when removing jalo classes
jaloCleanupExclude =

################################################################################
# Unit test settings ###########################################################
################################################################################
jacoco.enabled = true
testclasses.suppress.junit.tenant = true
testclasses.extensions =
testclasses.packages = de.sybit.*,de.ardex.*
testclasses.packages.excluded =

################################################################################
# Proxy settings ###############################################################
################################################################################
# systemProp.http.proxyHost=192.168.1.254
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=192.168.1.254
# systemProp.https.proxyPort=8080

################################################################################
# Gradle Plugin for E-commerce Systems (GraPES) ################################
################################################################################

# This plugin contains all tasks for building, running and deploying the commerce system
# 1.+ means it will always update to the latest minor version of 1.x.x
# Keep it like this since minor versions should never contain breaking changes!
grapesVersion = 1.+
# Disables the initialization banner if set to true
grapesDisableBanner = false

# Optional Feature Flags (GraPES)
# Uncomment any of the following flags to enable the optional features

# When enabling the following flag, GraPES will handle the reset and installation of hybris
# and hybris extension packs automatically. When disabled it will only notify the user,
# that the versions in manifest.json do not match the installed ones.
#grapesFeature_autoInstall = true

# GraPES >= v1.13.0 automatically commits the changes generated by the syncExtensions job.
# Enable the following flag, to restore the original behavior of GraPES.
#grapesFeature_disableAutoCommit = true

# GraPES >= v1.17.0 automatically configures the maven proxy using the $HOME/.m2/settings.xml
# This variable determines whether the proxy needs to be active for the current project
grapesFeature_requireSybitMavenMirror = true

# Uncomment this if you want to skip automatic detection of included Sonar extensions
# You need to set the "sonar.extensions" manually or everything will be included in Sonar scan
#grapes.skipSonarExtensionCollection = true

# Uncomment this if you want to skip automatic detection of excluded Sonar extensions
# You need to set the "sonar.excludedExtensions" manually or third-party and sybit extensions will be included in Sonar scan
#grapes.skipSonarExcludedExtensionCollection = true

# Exclude extensions from sonar check
#sonar.excludedExtensions =

# Exclude additional files and folders from jalo cleanup. Comma-separated (,)
#jaloCleanupExclude = **/deploymentscripts/jalo/*.java
