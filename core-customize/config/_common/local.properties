# ##############################################################################
# This file contains common settings which are relevant for all environments.
# ##############################################################################

# General
hac.webroot = /hac
hmc.default.login =
hmc.default.password =

# number of threads tomcat engine will use to start child host elements in
# parallel.
# 0 will result in the value of Runtime.getRuntime().availableProcessors()
# being used. 1 is the default value.
tomcat.startStopThreads = 0
tomcat.engine.startstopthreads=0

# disable addon filter due to performance reasons
addonfilter.active = false

# disable auditing to prevent auditing of changes to items for better
# performance
auditing.enabled = false

# language packs that should be installed
lang.packs = de,en

# limits the storage time for a session in the database to 360 seconds
default.session.timeout = 360

# disable DB driver update since SAP HANA DB driver (ngdbc) is not always
# available in public maven repo
maven.update.dbdrivers = false

# Specifies the number of entries displayed in the "Last Changes" field on the "Administration" tab
# in the hybris Management Console. The very last change (if available) is always displayed,
# even if this property is set to 0 (zero).
hmc.storing.modifiedvalues.size=8

# fix warning and reenable cart creation TODO: check if still needed
# promotions.legacy.mode=true

# CORS Base Settings
corsfilter.commercewebservices.allowedMethods = GET HEAD OPTIONS PATCH PUT POST \
  DELETE
corsfilter.commercewebservices.allowedHeaders = origin content-type accept \
  authorization cache-control if-none-match x-anonymous-consents

corsfilter.sybitlocalizationwebservices.allowedMethods = GET HEAD OPTIONS PATCH \
  PUT POST DELETE
corsfilter.sybitlocalizationwebservices.allowedHeaders = origin content-type \
  accept authorization cache-control if-none-match x-anonymous-consents

corsfilter.acceleratorservices.allowedMethods = GET HEAD OPTIONS PATCH PUT POST \
  DELETE
corsfilter.acceleratorservices.allowedHeaders = origin content-type accept \
  authorization cache-control if-none-match x-anonymous-consents

corsfilter.assistedservicewebservices.allowedMethods = GET HEAD OPTIONS PATCH \
  PUT POST DELETE
corsfilter.assistedservicewebservices.allowedHeaders = origin content-type \
  accept authorization cache-control x-anonymous-consents x-profile-tag-debug \
  x-consent-reference occ-personalization-id occ-personalization-time
corsfilter.assistedservicewebservices.exposedHeaders = x-anonymous-consents \
  occ-personalization-id occ-personalization-time
corsfilter.assistedservicewebservices.allowCredentials = true

# Always enable Checkout Payment SOP Mock as this store is only used for demo purposes
acceleratorservices.payment.sopmock.enabled=true

# Sybit extensions

# Localization

# enable localization extension for emails
sybitlocalizationcore.localize.emailtemplates = true

# enable occ path overlapping for being able to run B2C & B2B alongside each
# other
occ.rewrite.overlapping.paths.enabled = true

# skip SmartEdit build when the smartedit/apps/smartedit-master/dist/** exists
smartedittools.only.build.once = true

### solr
ardex.solr.indexing.user=solrindexingclient
ardex.solr.indexing.password=indexingclient123
ardex.solr.client.user=solrclient
ardex.solr.client.password=client123

ardex.solr.config.server.name=ardexSolrServerConfig

### oauth
ardex.web.oauth.client=ardex-spa
ardex.web.oauth.secret=5HejNJs6nDFeQp

# ##############################################################################
# Typesystem ###################################################################
# ##############################################################################

# The following property now allows you to create duplicate indices for the same columns using
# different column order
# The default value of this property is false. Running a system update or initialization with the
# default value of the property drops all duplicate indices that have been created previously with
# the flag set to true.
allow.duplicate.indexes.with.different.column.order = true

# In the default SAP Commerce Cloud configuration, the model context is not cleared after INSERT,
# INSERT_UPDATE, UPDATE, and REMOVE ImpEx operations.
# More Info: https://help.sap.com/docs/SAP_COMMERCE_CLOUD_PUBLIC_CLOUD/aa417173fe4a4ba5a473c93eb730a417/53260226a0fc4ae6aec6fc16276ada26.html?locale=en-US
#impex.clearing.model.context.after.processing.each.item.enabled = true

# When importing cron jobs through ImpEx, the system adds additional attributes needed for import
# purposes to SessionContext. All new cron jobs that are created receive all SessionContext
# attributes as sessionContextValues. To prevent sessionContextValues from holding redundant
# attributes that are required only during import, use the following property with a list of
# attributes that you don't want to save in new cron jobs' sessionContextAttributes
cronjob.ctx.filtered.attributes.in.impex.import.mode = disableRestrictions,disableRestrictionGroupInheritance,use.fast.algorithms,import.mode,disable.attribute.check,disable.interceptor.beans,disable.interceptor.types,disable.UniqueAttributesValidator.for.types,currentCronJob,currentJob,core.types.creation.initial,save.from.service.layer,ctx.enable.fs.on.read-replica,impex.creation


# ##############################################################################
# Process Engine ###############################################################
# ##############################################################################

# To make business processes more resilient in case of database outages or node failures, use the following property
# More Info: https://help.sap.com/docs/SAP_COMMERCE_CLOUD_PUBLIC_CLOUD/aa417173fe4a4ba5a473c93eb730a417/8c30e9ae86691014a36ed5fd11e24a1e.html#disconnecting-task-instances-from-business-process
mark.process.as.done.enabled = true


# ##############################################################################
# Secure-MediaWeb ##############################################################
# ##############################################################################

# disable default mediaweb extensions endpoint for cloud build
mediaweb.webroot =

# secure the root folder by default
# create a "public" MediaFolder for Medias in your projects
media.folder.root.secured = true
