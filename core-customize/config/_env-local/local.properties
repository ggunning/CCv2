# ##############################################################################
# This file contains all settings which are relevant for local development.
# If you like to add settings only for your local machine, please create a
# <project root>/config/user.properties file and add them there.
# ##############################################################################

# areco environment
deploymentscripts.environment.current=LOCAL

# disable junit tenant by default
installed.tenants =

# Reenable colors in console Output
tomcat.javaoptions = -DforceANSI=true
ansi.colors = true

# ensure smart-edit only builds once
smartedittools.only.build.once=true

# Auto run Backoffice SOLR indexer after initialization
backoffice.solr.search.index.autoinit = true

# set default password
# ONLY for development!
initialpassword.admin = nimda

# disable parallel build
# NOTE: enabling this can cause concurrency issues during the build
build.parallel = false

### Add-on activation flag for add-on 'hot-swap' filter.
### This should be true !only! for development environments
addonfilter.active=true

# Set the nodegroup for local development to be backgroundProcessing
# That way CronJobs can be set to run on nodeGroup=backgroundProcessing and still run locally
# https://help.sap.com/docs/SAP_COMMERCE_CLOUD_PUBLIC_CLOUD/aa417173fe4a4ba5a473c93eb730a417/8b55b41a86691014a150c099a4131a50.html#defining-groups-of-nodes
cluster.node.groups=backgroundProcessing

# cors headers
corsfilter.acceleratorservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.assistedservicewebservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.commercewebservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.default.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.oauth2.allowedOrigins = http://localhost:4200 https://localhost:4200 \
  http://localhost:9001 https://localhost:9002
corsfilter.permissionswebservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.personalizationwebservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.sybitlocalizationwebservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002
corsfilter.assistedservicewebservices.allowedOrigins = http://localhost:4200 \
  https://localhost:4200 http://localhost:9001 https://localhost:9002

# for spartacus checkout steps
sop.post.url = https://localhost:9002/acceleratorservices/sop-mock/process

# solr
ardex.solr.host1=https\://localhost\:8983/solr
ardex.solr.mode=standalone

# oauth
ardex.web.oauth.host=localhost:9002

website.powertools-spa.http=http://localhost:4200
website.powertools-spa.https=https://localhost:4200

media.powertools-spa.http=http://localhost:9001
media.powertools-spa.https=https://localhost:9002

# uncomment to disable smartedittools build for local dev system. Reduces build time but there will be issues in SmartEdit
#smartedit.smartedittools.config=false
#cmssmartedit.smartedittools.config=false
#personalizationsmartedit.smartedittools.config=false
#personalizationsearchsmartedit.smartedittools.config=false
#personalizationpromotionssmartedit.smartedittools.config=false

# enable development mode with additional logging and buttons in backoffice
backoffice.cockpitng.development.mode                  = true
backoffice.cockpitng.hotDeployment.enabled             = true
development.mode                                       = true
build.development.mode                                 = true
tomcat.development.mode                                = true

# deactivate DB_AUDIT logging as it useless without opensearch
log4j2.logger.auditableActionsHandler.name             = de.hybris.platform.audit.actions.impl.Slf4jAuditableActionHandler
log4j2.logger.auditableActionsHandler.level            = OFF
