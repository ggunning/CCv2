# Loads resources/casireturnsocc-spring.xml (the S/4 OData client) into the core application context,
# the same way SAP's OCC extensions do (saps4omocc.application-context, b2bocc.application-context).
# Without it the OCC controller can't be created and every s4returns call fails.
casireturnsocc.application-context=casireturnsocc-spring.xml

# Consumed destinations (Backoffice > System > API > Destinations > Consumed Destinations)
# Sales orders: the destination SAP S/4HANA Order Management already uses (API_SALES_ORDER_SRV, OData V2).
casireturnsocc.destination.order=s4omOrderDestination
# Customer returns: API_CUSTOMER_RETURN_SRV (SAP_COM_0157), additional property csrfURL = <url>$metadata
casireturnsocc.destination.return=casiCustomerReturnDestination

# S/4 customer return document type (advanced returns) and optional return reason (SDDocumentReason)
casireturnsocc.return.type=CBAR
casireturnsocc.return.reason=
