# Loads resources/casiserviceocc-spring.xml (the Sales and Service Cloud client) into the core
# application context, the same way casireturnsocc and SAP's OCC extensions do.
casiserviceocc.application-context=casiserviceocc-spring.xml
# Consumed destination (Backoffice > System > API > Destinations > Consumed Destinations):
# URL = https://<tenant>/sap/c4c/api/v1/ with a Basic credential of a Sales and Service Cloud API user.
# Additional properties on the destination override the settings below: caseTypes, processor, origin, priority.
casiserviceocc.destination=casiSscCaseDestination
# Case types a customer can choose (comma separated; names are read from Sales and Service Cloud)
casiserviceocc.caseTypes=ZSMP,ZINQ,ZDSR,ZPAA
# Employee (employee display ID) who becomes the processor of a new case: a case cannot be saved without one
casiserviceocc.processor=ADMINISTRATOR
# Origin and priority of a new case
casiserviceocc.origin=SELF_SERVICE
casiserviceocc.priority=03
# Name of the shop in the line that says who wrote a message
casiserviceocc.shopName=CASI Shop
# User statuses a customer sets: "close" a ticket, "reopen" a completed one (a closed case stays closed)
casiserviceocc.closeStatus=05
casiserviceocc.reopenStatus=02

# Documents in My Account (SelfServiceController): the kinds the shop offers, in this order. Known kinds:
# invoices, returns, quotations, contracts, deliveries (SAP S/4HANA) and products (registered products),
# installedbase, sscorders, appointments (Sales and Service Cloud). Offer contracts and deliveries once the
# S/4 communication user may read them.
casiserviceocc.documents=products,installedbase,invoices,returns,quotations,sscorders
# The consumed destination of an S/4 kind can be changed: casiserviceocc.destination.<kind>=<destination id>

# Company registration (OrgRegistrationController, POST /orgregistrations). The endpoint is public, so it is
# closed until a registration code is set: additional property "registrationCode" on the Sales and Service
# Cloud destination (set by casi-data/12, from CASI_REGISTRATION_CODE in .env), or here.
casiserviceocc.registrationCode=
# ID of the Sales and Service Cloud communication system that stands for S/4: new accounts get the S/4
# customer number as external ID in it. Also an additional property of the destination.
casiserviceocc.s4CommunicationSystemId=
# Sales area and currency of a new customer in S/4, and the currency of the unit's cost center
casiserviceocc.registration.salesOrganization=DE10
casiserviceocc.registration.distributionChannel=10
casiserviceocc.registration.division=10
casiserviceocc.registration.currency=EUR
