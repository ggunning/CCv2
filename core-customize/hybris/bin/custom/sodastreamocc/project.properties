# Loads resources/sodastreamocc-spring.xml (SodastreamService) into the core application context.
# Without it the OCC controller can't get its service and the endpoints fail to start.
sodastreamocc.application-context=sodastreamocc-spring.xml

# Text the service returns in status(); change it per environment to see config reach the node.
sodastreamocc.greeting=Sodastream extension is wired
